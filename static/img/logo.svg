<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BF33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FE0CB;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Geometric Frame (Hexagon) -->
  <path d="M50 5 L90 25 L90 75 L50 95 L10 75 L10 25 Z" fill="none" stroke="url(#logo-gradient)" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Refined "M" Shape (Mauricio) -->
  <path d="M25 70 V35 L50 60 L75 35 V70" fill="none" stroke="url(#logo-gradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" from="0, 200" to="200, 0" dur="2s" fill="freeze" />
  </path>
  
  <!-- Pulse Dot (System Alive) -->
  <circle cx="50" cy="75" r="4" fill="#FFFC30">
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>